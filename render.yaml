# ==============================================================================
# @file: render.yaml
# @project: GeoSync — AI-Powered Geospatial Middleware
# @description: Render Infrastructure Blueprint for automated deployment.
# ==============================================================================

services:
  # ── GeoSync FastAPI Backend ────────────────────────────────────────────────
  - type: web
    name: geosync-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: geosync-postgres
          property: connectionString
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379

databases:
  # ── Render Managed PostgreSQL Database ─────────────────────────────────────
  - name: geosync-postgres
    databaseName: geosync_db
    user: geosync_user
    plan: free
    region: oregon
