version: '3.8'

services:
  geosync-db:
    image: postgis/postgis:16-3.4
    container_name: geosync-postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: geosync_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - geosync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geosync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: geosync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - geosync_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  geosync_pgdata:
    driver: local
  geosync_redisdata:
    driver: local
