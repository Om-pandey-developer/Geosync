<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Field crop textures -->
    <pattern id="cropField1" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#3D683A"/>
      <line x1="0" y1="0" x2="20" y2="20" stroke="#487A44" stroke-width="2"/>
    </pattern>
    <pattern id="cropField2" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#4A7545"/>
      <line x1="0" y1="15" x2="15" y2="0" stroke="#568A50" stroke-width="1.5"/>
    </pattern>
    <pattern id="soilField" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#8C7654"/>
      <circle cx="10" cy="10" r="1.5" fill="#756244"/>
      <circle cx="25" cy="22" r="1.8" fill="#6B593E"/>
    </pattern>
    <pattern id="paddyField" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#2E5C38"/>
      <rect x="2" y="2" width="4" height="4" fill="#3B7347"/>
    </pattern>
  </defs>

  <!-- Base Terrain / Orthomosaic Texture -->
  <rect width="1200" height="900" fill="#2D4D2E"/>

  <!-- Agricultural Farm Plots (Modern High-Res 5cm Drone Imagery) -->
  <polygon points="175,170 345,158 372,312 195,332" fill="url(#cropField1)" stroke="#528C4E" stroke-width="2"/>
  <polygon points="345,158 522,146 562,302 372,312" fill="url(#paddyField)" stroke="#4A7545" stroke-width="2"/>
  <polygon points="522,146 712,132 748,292 562,302" fill="url(#soilField)" stroke="#7A684C" stroke-width="2"/>
  <polygon points="712,132 912,118 952,284 748,292" fill="url(#cropField2)" stroke="#568A50" stroke-width="2"/>

  <!-- Row 2 Plots -->
  <polygon points="195,332 372,312 396,492 216,512" fill="url(#paddyField)" stroke="#3D683A" stroke-width="2"/>
  <polygon points="372,312 562,302 592,482 396,492" fill="url(#cropField1)" stroke="#528C4E" stroke-width="2"/>
  <polygon points="562,302 748,292 782,472 592,482" fill="url(#cropField2)" stroke="#487A44" stroke-width="2"/>
  <polygon points="748,292 952,284 988,468 782,472" fill="url(#soilField)" stroke="#6B593E" stroke-width="2"/>

  <!-- Row 3 Plots -->
  <polygon points="216,512 396,492 422,682 232,702" fill="url(#soilField)" stroke="#756244" stroke-width="2"/>
  <polygon points="396,492 592,482 622,672 422,682" fill="url(#paddyField)" stroke="#4A7545" stroke-width="2"/>
  <polygon points="592,482 782,472 816,662 622,672" fill="url(#cropField1)" stroke="#528C4E" stroke-width="2"/>
  <polygon points="782,472 988,468 1018,658 816,662" fill="url(#cropField2)" stroke="#568A50" stroke-width="2"/>

  <!-- Metal Road / Pucca Marg with White Stripes -->
  <path d="M 160 520 C 350 500, 750 480, 1040 470" fill="none" stroke="#2B2D31" stroke-width="14" stroke-linecap="round"/>
  <path d="M 160 520 C 350 500, 750 480, 1040 470" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="8,6"/>

  <!-- Irrigation Canal (Blue Ribbon) -->
  <path d="M 940 90 Q 980 400 1020 820" fill="none" stroke="#1D4ED8" stroke-width="10" stroke-opacity="0.85" stroke-linecap="round"/>
  <path d="M 940 90 Q 980 400 1020 820" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>

  <!-- Trees / Green Foliage Shadows -->
  <g fill="#1B381A" opacity="0.65">
    <ellipse cx="370" cy="312" rx="14" ry="12"/>
    <ellipse cx="562" cy="302" rx="16" ry="14"/>
    <ellipse cx="782" cy="472" rx="15" ry="13"/>
    <ellipse cx="216" cy="512" rx="18" ry="15"/>
  </g>
  <g fill="#2D5A2C">
    <ellipse cx="366" cy="308" rx="12" ry="10"/>
    <ellipse cx="558" cy="298" rx="14" ry="12"/>
    <ellipse cx="778" cy="468" rx="13" ry="11"/>
    <ellipse cx="212" cy="508" rx="16" ry="13"/>
  </g>

  <!-- Drone Survey HUD Overlay -->
  <g transform="translate(40, 40)">
    <rect width="360" height="64" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#0D9488" stroke-width="1.5"/>
    <circle cx="24" cy="32" r="8" fill="#10B981"/>
    <text x="42" y="27" font-family="monospace" font-size="13" font-weight="bold" fill="#F8FAFC">
      NAKSHA ORTHOMOSAIC • 5cm GSD
    </text>
    <text x="42" y="47" font-family="monospace" font-size="11" fill="#94A3B8">
      ALT: 120m AGL • SENSOR: RGB-48MP • RTK-FIXED
    </text>
  </g>

  <!-- Scale Bar & Compass -->
  <g transform="translate(1040, 830)">
    <rect x="-10" y="-20" width="130" height="35" rx="4" fill="rgba(15, 23, 42, 0.85)"/>
    <line x1="0" y1="0" x2="100" y2="0" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="100" y1="-5" x2="100" y2="5" stroke="#FFFFFF" stroke-width="2"/>
    <text x="50" y="-8" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">50 METERS</text>
  </g>
</svg>
